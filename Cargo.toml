[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/client",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains (`if let .. && let ..`) are used throughout and stabilized in 1.88.
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
offload-protocol = { path = "crates/protocol" }
offload-client = { path = "crates/client" }

axum = "0.8"
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
if-addrs = "0.13"
mimalloc = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "signal", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Lint set from rustguide.md (M-STATIC-VERIFICATION).
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"

# Opt-outs:
# Crates are not published to crates.io, so registry metadata is noise.
cargo_common_metadata = "allow"
# Duplicate versions come from transitive deps (axum/reqwest/clap); not ours to unify.
multiple_crate_versions = "allow"
# u64 -> f64 casts only feed progress/speed display; sub-byte precision past 2^52 is irrelevant.
cast_precision_loss = "allow"
